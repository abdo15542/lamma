name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lamma
        uses: actions/checkout@v4

      - name: Fetch signing keys
        uses: actions/checkout@v4
        with:
          repository: abdo15542/lamma-keys
          token: ${{ secrets.KEYS_PAT }}
          path: keys

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android
      - name: Add call permissions
        run: |
          python3 - <<'PYEOF'
          import io
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = '<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    '
          if "RECORD_AUDIO" not in s:
              s = s.replace("<application", perms + "<application", 1)
              open(p, "w", encoding="utf-8").write(s)
          cur = open(p, encoding="utf-8").read()
          print("call permissions ok" if "RECORD_AUDIO" in cur else "FAILED")
          PYEOF

      - name: Add Firebase config
        run: |
          python3 - <<'PYEOF'
          import os
          src = "keys/google-services.json"
          dst = "android/app/google-services.json"
          if not os.path.exists(src):
              print("no google-services.json in keys, skipping Firebase setup")
          else:
              import shutil
              shutil.copyfile(src, dst)
              root = open("android/build.gradle", encoding="utf-8").read()
              if "com.google.gms:google-services" not in root:
                  lines = root.split("\n")
                  done = False
                  for i, ln in enumerate(lines):
                      if ln.strip().startswith("classpath"):
                          lines.insert(i + 1, "        classpath 'com.google.gms:google-services:4.4.2'")
                          done = True
                          break
                  if not done:
                      raise SystemExit("FAILED: no classpath line in android/build.gradle")
                  open("android/build.gradle", "w", encoding="utf-8").write("\n".join(lines))
              app = open("android/app/build.gradle", encoding="utf-8").read()
              if "com.google.gms.google-services" not in app:
                  if "apply plugin: 'com.android.application'" in app:
                      app = app.replace("apply plugin: 'com.android.application'", "apply plugin: 'com.android.application'\napply plugin: 'com.google.gms.google-services'", 1)
                  else:
                      raise SystemExit("FAILED: no com.android.application plugin line in android/app/build.gradle")
                  open("android/app/build.gradle", "w", encoding="utf-8").write(app)
              print("firebase config ok")
          PYEOF
      - name: Generate app icons
        run: |
          npm i -D @capacitor/assets
          npx @capacitor/assets generate --android --iconBackgroundColor '#0f766e' || true

      - name: Configure fixed signing
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          # Write password to a file Gradle can read directly
          echo -n "$KS_PASS" > keys/lamma.password
          chmod 600 keys/lamma.password
          
          # Append signing config that reads from the file
          cat >> android/app/build.gradle << 'GRADLE'
          
          def lammaPasswordFile = file("../../keys/lamma.password")
          def lammaPassword = lammaPasswordFile.exists() ? lammaPasswordFile.text.trim() : ""
          
          android {
            signingConfigs {
              lamma {
                storeFile file("../../keys/lamma.keystore")
                storePassword lammaPassword
                keyAlias "lamma"
                keyPassword lammaPassword
              }
            }
            buildTypes {
              debug { signingConfig signingConfigs.lamma }
            }
          }
          GRADLE
          
          echo "Signing config appended"

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lamma-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publish auto release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest auto build"
          body: "Auto build from commit ${{ github.sha }}"
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Force-move latest tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -f latest "${{ github.sha }}"
          git push -f origin refs/tags/latest
